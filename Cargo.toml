[package]
name = "rust-age"
version = "0.1.0"
edition = "2021"
description = "Unfinished Rust port of Fallout 1 Community Edition"
license-file = "LICENSE"
repository = "https://github.com/sguzman/rust-age"
publish = false

[lib]
name = "rust_age"
path = "src/lib.rs"

[[bin]]
name = "rust-age"
path = "src/main.rs"

[features]
default = []
native-window = ["dep:sdl2"]

[dependencies]
sdl2 = { version = "0.38", optional = true }

[[bin]]
name = "rust-age-view"
path = "src/bin/view.rs"
required-features = ["native-window"]

[[bin]]
name = "rust-age-map-view"
path = "src/bin/map_view.rs"
required-features = ["native-window"]
