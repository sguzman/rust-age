name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-age-main
  cancel-in-progress: true
jobs:
  core:
    name: Rust core and roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Compare CE C++ and Rust spatial projections
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/spatial_oracle.cc -o /tmp/rust-age-ce-spatial
          /tmp/rust-age-ce-spatial > /tmp/rust-age-cpp-spatial.txt
          cargo run --quiet --bin spatial_probe > /tmp/rust-age-rust-spatial.txt
          diff -u /tmp/rust-age-cpp-spatial.txt /tmp/rust-age-rust-spatial.txt
      - name: Compare CE C++ and Rust path-search decisions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/path_oracle.cc -o /tmp/rust-age-ce-path
          /tmp/rust-age-ce-path > /tmp/rust-age-ce-path.txt
          cargo run --quiet --bin path_probe > /tmp/rust-age-rust-path.txt
          diff -u /tmp/rust-age-ce-path.txt /tmp/rust-age-rust-path.txt
      - name: Compare CE C++ and Rust numeric interpreter decisions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_numeric_oracle.cc -o /tmp/rust-age-ce-int
          /tmp/rust-age-ce-int tests/int_numeric_cases.txt > /tmp/rust-age-ce-int.txt
          cargo run --quiet --bin int_numeric_probe > /tmp/rust-age-rust-int.txt
          diff -u /tmp/rust-age-ce-int.txt /tmp/rust-age-rust-int.txt
      - name: Compare CE C++ and Rust named-procedure lookup
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_named_oracle.cc -o /tmp/rust-age-ce-named
          /tmp/rust-age-ce-named tests/int_named_cases.txt > /tmp/rust-age-ce-named.txt
          cargo run --quiet --bin int_named_probe > /tmp/rust-age-rust-named.txt
          diff -u /tmp/rust-age-ce-named.txt /tmp/rust-age-rust-named.txt
      - name: Compare CE C++ and Rust static string comparisons
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_string_oracle.cc -o /tmp/rust-age-ce-strings
          /tmp/rust-age-ce-strings tests/int_string_cases.txt > /tmp/rust-age-ce-strings.txt
          cargo run --quiet --bin int_string_probe > /tmp/rust-age-rust-strings.txt
          diff -u /tmp/rust-age-ce-strings.txt /tmp/rust-age-rust-strings.txt
      - name: Compare CE C++ and Rust procedure scheduling metadata
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_schedule_oracle.cc -o /tmp/rust-age-ce-schedule
          /tmp/rust-age-ce-schedule tests/int_schedule_cases.txt > /tmp/rust-age-ce-schedule.txt
          cargo run --quiet --bin int_schedule_probe > /tmp/rust-age-rust-schedule.txt
          diff -u /tmp/rust-age-ce-schedule.txt /tmp/rust-age-rust-schedule.txt
      - name: Compare CE C++ and Rust local interrupt stack return
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_interrupt_oracle.cc -o /tmp/rust-age-ce-interrupt
          /tmp/rust-age-ce-interrupt tests/int_interrupt_cases.txt > /tmp/rust-age-ce-interrupt.txt
          cargo run --quiet --bin int_interrupt_probe > /tmp/rust-age-rust-interrupt.txt
          diff -u /tmp/rust-age-ce-interrupt.txt /tmp/rust-age-rust-interrupt.txt
      - name: Compare CE C++ and Rust script action and overrides
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_invocation_oracle.cc -o /tmp/rust-age-ce-invocation
          /tmp/rust-age-ce-invocation tests/script_invocation_cases.txt > /tmp/rust-age-ce-invocation.txt
          cargo run --quiet --bin script_invocation_probe > /tmp/rust-age-rust-invocation.txt
          diff -u /tmp/rust-age-ce-invocation.txt /tmp/rust-age-rust-invocation.txt
      - name: Compare CE C++ and Rust bounded native-variable bytecode traces
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/native_bytecode_oracle.cc -o /tmp/rust-age-ce-native-bytecode
          /tmp/rust-age-ce-native-bytecode tests/native_bytecode_cases.txt > /tmp/rust-age-ce-native-bytecode.txt
          cargo run --quiet --bin native_bytecode_probe > /tmp/rust-age-rust-native-bytecode.txt
          diff -u /tmp/rust-age-ce-native-bytecode.txt /tmp/rust-age-rust-native-bytecode.txt
      - name: Compare CE C++ and Rust random/roll_dice native opcodes
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_random_oracle.cc -o /tmp/rust-age-ce-script-random
          /tmp/rust-age-ce-script-random tests/script_random_cases.txt > /tmp/rust-age-ce-script-random.txt
          cargo run --quiet --bin script_random_probe > /tmp/rust-age-rust-script-random.txt
          diff -u /tmp/rust-age-ce-script-random.txt /tmp/rust-age-rust-script-random.txt
      - name: Compare CE C++ and Rust script_q timer payload and ordering
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_timer_oracle.cc -o /tmp/rust-age-ce-script-timer
          /tmp/rust-age-ce-script-timer tests/script_timer_cases.txt > /tmp/rust-age-ce-script-timer.txt
          cargo run --quiet --bin script_timer_probe > /tmp/rust-age-rust-script-timer.txt
          diff -u /tmp/rust-age-ce-script-timer.txt /tmp/rust-age-rust-script-timer.txt
      - name: Compare CE C++ and Rust scripted clock invocation bytecode
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_clock_invocation_oracle.cc -o /tmp/rust-age-ce-clock-invocation
          /tmp/rust-age-ce-clock-invocation tests/script_clock_invocation_cases.txt > /tmp/rust-age-ce-clock-invocation.txt
          cargo run --quiet --bin script_clock_invocation_probe > /tmp/rust-age-rust-clock-invocation.txt
          diff -u /tmp/rust-age-ce-clock-invocation.txt /tmp/rust-age-rust-clock-invocation.txt
      - name: Compare CE C++ and Rust game-time tick conversions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_clock_oracle.cc -o /tmp/rust-age-ce-script-clock
          /tmp/rust-age-ce-script-clock tests/script_clock_cases.txt > /tmp/rust-age-ce-script-clock.txt
          cargo run --quiet --bin script_clock_probe > /tmp/rust-age-rust-script-clock.txt
          diff -u /tmp/rust-age-ce-script-clock.txt /tmp/rust-age-rust-script-clock.txt
      - name: Compare CE C++ and Rust object property reads
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_object_read_oracle.cc -o /tmp/rust-age-ce-object-read
          /tmp/rust-age-ce-object-read tests/script_object_read_cases.txt > /tmp/rust-age-ce-object-read.txt
          cargo run --quiet --bin script_object_read_probe > /tmp/rust-age-rust-object-read.txt
          diff -u /tmp/rust-age-ce-object-read.txt /tmp/rust-age-rust-object-read.txt
      - name: Compare CE C++ and Rust speculative local procedure variable writes
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_sandbox_write_oracle.cc -o /tmp/rust-age-ce-sandbox-write
          /tmp/rust-age-ce-sandbox-write tests/script_sandbox_write_cases.txt > /tmp/rust-age-ce-sandbox-write.txt
          cargo run --quiet --bin script_sandbox_write_probe > /tmp/rust-age-rust-sandbox-write.txt
          diff -u /tmp/rust-age-ce-sandbox-write.txt /tmp/rust-age-rust-sandbox-write.txt
      - name: Compare CE C++ and Rust immutable MAP and game-global local procedure reads
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_local_globals_oracle.cc -o /tmp/rust-age-ce-local-globals
          /tmp/rust-age-ce-local-globals tests/script_local_globals_cases.txt > /tmp/rust-age-ce-local-globals.txt
          cargo run --quiet --bin script_local_globals_probe > /tmp/rust-age-rust-local-globals.txt
          diff -u /tmp/rust-age-ce-local-globals.txt /tmp/rust-age-rust-local-globals.txt
      - name: Compare CE C++ and Rust detached MAP-global conditions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_condition_read_oracle.cc -o /tmp/rust-age-ce-condition-read
          /tmp/rust-age-ce-condition-read tests/script_condition_read_cases.txt > /tmp/rust-age-ce-condition-read.txt
          cargo run --quiet --bin script_condition_read_probe > /tmp/rust-age-rust-condition-read.txt
          diff -u /tmp/rust-age-ce-condition-read.txt /tmp/rust-age-rust-condition-read.txt
      - name: Compare CE C++ and Rust conditional interpreter frame preservation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_condition_frame_oracle.cc -o /tmp/rust-age-ce-condition-frame
          /tmp/rust-age-ce-condition-frame tests/script_condition_frame_cases.txt > /tmp/rust-age-ce-condition-frame.txt
          cargo run --quiet --bin script_condition_frame_probe > /tmp/rust-age-rust-condition-frame.txt
          diff -u /tmp/rust-age-ce-condition-frame.txt /tmp/rust-age-rust-condition-frame.txt
      - name: Compare CE C++ and Rust sequential conditional-event side effects
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_due_sequence_oracle.cc -o /tmp/rust-age-ce-due-sequence
          /tmp/rust-age-ce-due-sequence tests/script_due_sequence_cases.txt > /tmp/rust-age-ce-due-sequence.txt
          cargo run --quiet --bin script_due_sequence_probe > /tmp/rust-age-rust-due-sequence.txt
          diff -u /tmp/rust-age-ce-due-sequence.txt /tmp/rust-age-rust-due-sequence.txt
      - name: Compare CE C++ and Rust sequential CALL_WHEN and CANCEL mutations
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_due_mutation_oracle.cc -o /tmp/rust-age-ce-due-mutation
          /tmp/rust-age-ce-due-mutation tests/script_due_mutation_cases.txt > /tmp/rust-age-ce-due-mutation.txt
          cargo run --quiet --bin script_due_mutation_probe > /tmp/rust-age-rust-due-mutation.txt
          diff -u /tmp/rust-age-ce-due-mutation.txt /tmp/rust-age-rust-due-mutation.txt
      - name: Compare CE C++ and Rust doEvents condition flag and PC restoration
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_condition_restore_oracle.cc -o /tmp/rust-age-ce-condition-restore
          /tmp/rust-age-ce-condition-restore tests/script_condition_restore_cases.txt > /tmp/rust-age-ce-condition-restore.txt
          cargo run --quiet --bin script_condition_restore_probe > /tmp/rust-age-rust-condition-restore.txt
          diff -u /tmp/rust-age-ce-condition-restore.txt /tmp/rust-age-rust-condition-restore.txt
      - name: Compare CE C++ and Rust POP_EXIT transient flag and return address
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_pop_exit_oracle.cc -o /tmp/rust-age-ce-pop-exit
          /tmp/rust-age-ce-pop-exit tests/script_pop_exit_cases.txt > /tmp/rust-age-ce-pop-exit.txt
          cargo run --quiet --bin script_pop_exit_probe > /tmp/rust-age-rust-pop-exit.txt
          diff -u /tmp/rust-age-ce-pop-exit.txt /tmp/rust-age-rust-pop-exit.txt
      - name: Compare CE C++ and Rust conditional EXIT versus STOP flags
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_termination_oracle.cc -o /tmp/rust-age-ce-termination
          /tmp/rust-age-ce-termination tests/script_termination_cases.txt > /tmp/rust-age-ce-termination.txt
          cargo run --quiet --bin script_termination_probe > /tmp/rust-age-rust-termination.txt
          diff -u /tmp/rust-age-ce-termination.txt /tmp/rust-age-rust-termination.txt
      - name: Compare CE C++ and Rust detached local procedure returns
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_local_return_oracle.cc -o /tmp/rust-age-ce-local-return
          /tmp/rust-age-ce-local-return tests/script_local_return_cases.txt > /tmp/rust-age-ce-local-return.txt
          cargo run --quiet --bin script_local_return_probe > /tmp/rust-age-rust-local-return.txt
          diff -u /tmp/rust-age-ce-local-return.txt /tmp/rust-age-rust-local-return.txt
      - name: Compare CE C++ and Rust local procedure-call preflight
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_local_frame_oracle.cc -o /tmp/rust-age-ce-local-frame
          /tmp/rust-age-ce-local-frame tests/script_local_frame_cases.txt > /tmp/rust-age-ce-local-frame.txt
          cargo run --quiet --bin script_local_frame_probe > /tmp/rust-age-rust-local-frame.txt
          diff -u /tmp/rust-age-ce-local-frame.txt /tmp/rust-age-rust-local-frame.txt
      - name: Compare CE C++ and Rust detached script event lifetime
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_event_lifecycle_oracle.cc -o /tmp/rust-age-ce-event-lifecycle
          /tmp/rust-age-ce-event-lifecycle tests/script_event_lifecycle_cases.txt > /tmp/rust-age-ce-event-lifecycle.txt
          cargo run --quiet --bin script_event_lifecycle_probe > /tmp/rust-age-rust-event-lifecycle.txt
          diff -u /tmp/rust-age-ce-event-lifecycle.txt /tmp/rust-age-rust-event-lifecycle.txt
      - name: Compare CE C++ and Rust obj-being-used-with native alias
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_used_with_oracle.cc -o /tmp/rust-age-ce-used-with
          /tmp/rust-age-ce-used-with tests/script_used_with_cases.txt > /tmp/rust-age-ce-used-with.txt
          cargo run --quiet --bin script_used_with_probe > /tmp/rust-age-rust-used-with.txt
          diff -u /tmp/rust-age-ce-used-with.txt /tmp/rust-age-rust-used-with.txt
      - name: Compare CE C++ and Rust source-target object event queries
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_event_obj_oracle.cc -o /tmp/rust-age-ce-event-obj
          /tmp/rust-age-ce-event-obj tests/script_event_obj_cases.txt > /tmp/rust-age-ce-event-obj.txt
          cargo run --quiet --bin script_event_obj_probe > /tmp/rust-age-rust-event-obj.txt
          diff -u /tmp/rust-age-ce-event-obj.txt /tmp/rust-age-rust-event-obj.txt
      - name: Compare CE C++ and Rust nonspatial self-obj binding
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_self_obj_oracle.cc -o /tmp/rust-age-ce-self-obj
          /tmp/rust-age-ce-self-obj tests/script_self_obj_cases.txt > /tmp/rust-age-ce-self-obj.txt
          cargo run --quiet --bin script_self_obj_probe > /tmp/rust-age-rust-self-obj.txt
          diff -u /tmp/rust-age-ce-self-obj.txt /tmp/rust-age-rust-self-obj.txt
      - name: Compare CE C++ and Rust tile-contains-PID script query
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_tile_contains_oracle.cc -o /tmp/rust-age-ce-tile-contains
          /tmp/rust-age-ce-tile-contains tests/script_tile_contains_cases.txt > /tmp/rust-age-ce-tile-contains.txt
          cargo run --quiet --bin script_tile_contains_probe > /tmp/rust-age-rust-tile-contains.txt
          diff -u /tmp/rust-age-ce-tile-contains.txt /tmp/rust-age-rust-tile-contains.txt
      - name: Compare CE C++ and Rust game-time advance ordering
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/script_time_advance_oracle.cc -o /tmp/rust-age-ce-time-advance
          /tmp/rust-age-ce-time-advance tests/script_time_advance_cases.txt > /tmp/rust-age-ce-time-advance.txt
          cargo run --quiet --bin script_time_advance_probe > /tmp/rust-age-rust-time-advance.txt
          diff -u /tmp/rust-age-ce-time-advance.txt /tmp/rust-age-rust-time-advance.txt
      - name: Compare CE C++ and Rust vault13.gam global default parsing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/game_global_defaults_oracle.cc -o /tmp/rust-age-ce-gvar-defaults
          /tmp/rust-age-ce-gvar-defaults tests/game_global_defaults_cases.txt > /tmp/rust-age-ce-gvar-defaults.txt
          cargo run --quiet --bin game_global_defaults_probe > /tmp/rust-age-rust-gvar-defaults.txt
          diff -u /tmp/rust-age-ce-gvar-defaults.txt /tmp/rust-age-rust-gvar-defaults.txt
      - name: Compare CE C++ and Rust game-global quest flag opcodes
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/game_global_oracle.cc -o /tmp/rust-age-ce-game-globals
          /tmp/rust-age-ce-game-globals tests/game_global_cases.txt > /tmp/rust-age-ce-game-globals.txt
          cargo run --quiet --bin game_global_probe > /tmp/rust-age-rust-game-globals.txt
          diff -u /tmp/rust-age-ce-game-globals.txt /tmp/rust-age-rust-game-globals.txt
      - name: Compare CE C++ and Rust native MAP/local variable opcodes
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/native_variable_oracle.cc -o /tmp/rust-age-ce-native-vars
          /tmp/rust-age-ce-native-vars tests/native_variable_cases.txt > /tmp/rust-age-ce-native-vars.txt
          cargo run --quiet --bin native_variable_probe > /tmp/rust-age-rust-native-vars.txt
