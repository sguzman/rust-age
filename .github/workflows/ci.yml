name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-age-main
  cancel-in-progress: true
jobs:
  core:
    name: Rust core and roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Compare CE C++ and Rust spatial projections
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/spatial_oracle.cc -o /tmp/rust-age-ce-spatial
          /tmp/rust-age-ce-spatial > /tmp/rust-age-cpp-spatial.txt
          cargo run --quiet --bin spatial_probe > /tmp/rust-age-rust-spatial.txt
          diff -u /tmp/rust-age-cpp-spatial.txt /tmp/rust-age-rust-spatial.txt
      - name: Compare CE C++ and Rust path-search decisions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/path_oracle.cc -o /tmp/rust-age-ce-path
          /tmp/rust-age-ce-path > /tmp/rust-age-ce-path.txt
          cargo run --quiet --bin path_probe > /tmp/rust-age-rust-path.txt
          diff -u /tmp/rust-age-ce-path.txt /tmp/rust-age-rust-path.txt
      - name: Compare CE C++ and Rust numeric interpreter decisions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_numeric_oracle.cc -o /tmp/rust-age-ce-int
          /tmp/rust-age-ce-int tests/int_numeric_cases.txt > /tmp/rust-age-ce-int.txt
          cargo run --quiet --bin int_numeric_probe > /tmp/rust-age-rust-int.txt
          diff -u /tmp/rust-age-ce-int.txt /tmp/rust-age-rust-int.txt
      - name: Compare CE C++ and Rust named-procedure lookup
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/int_named_oracle.cc -o /tmp/rust-age-ce-named
          /tmp/rust-age-ce-named tests/int_named_cases.txt > /tmp/rust-age-ce-named.txt
          cargo run --quiet --bin int_named_probe > /tmp/rust-age-rust-named.txt
          diff -u /tmp/rust-age-ce-named.txt /tmp/rust-age-rust-named.txt
      - run: python3 tools/render_roadmap.py --check
      - run: python3 tools/render_port_matrix.py --check

  native-window:
    name: Optional SDL2 window compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SDL2 development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - name: Compile and lint native viewer
        run: cargo clippy --all-targets --all-features -- -D warnings
