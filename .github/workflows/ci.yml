        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/map_lifecycle_oracle.cc -o /tmp/rust-age-ce-lifecycle
          /tmp/rust-age-ce-lifecycle tests/map_lifecycle_cases.txt > /tmp/rust-age-ce-lifecycle.txt
