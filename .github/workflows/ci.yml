      - name: Compare CE C++ and Rust MAP-global tagged values
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/map_global_oracle.cc -o /tmp/rust-age-ce-globals
          /tmp/rust-age-ce-globals tests/map_global_cases.txt > /tmp/rust-age-ce-globals.txt
          cargo run --quiet --bin map_global_probe > /tmp/rust-age-rust-globals.txt
