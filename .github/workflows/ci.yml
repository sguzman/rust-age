name: Rust checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Install SDL2 development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: python3 tools/render_roadmap.py --check
      - run: python3 tools/render_port_matrix.py --check
